"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Inicio automático. En Windows, el inicio automático se ejecuta en el escritorio tras iniciar sesión en lugar de ejecutarse como servicio en segundo plano. Predeterminado false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Intervalo de supervisión. Período de comprobación del uso de recursos, en segundos. Predeterminado 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Intervalo de liberación de memoria. Ejecutar GC periódicamente y liberar memoria virtual, en segundos. Predeterminado 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Memoria máxima. Reiniciar el proceso cuando el uso supere este valor para liberar recursos. Predeterminado 0 significa ilimitado."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Número máximo de subprocesos. Reiniciar el proceso cuando el número de subprocesos supere este valor para liberar recursos. Predeterminado 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Número máximo de identificadores. Reiniciar el proceso cuando el número de identificadores supere este valor para liberar recursos. Predeterminado 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Reinicio automático. Reiniciar automáticamente el proceso cuando se alcance este intervalo, en minutos. Predeterminado 0 significa ilimitado."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Rango horario de reinicio automático. Restringir los reinicios a este intervalo, formato 00:00-06:00. Predeterminado ilimitado."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Vigilante. Proteger otros servicios y comprobar cada minuto. Separar varios nombres de servicio con comas."
"After start. Command to run after the service starts.": "Después del inicio. Comando que se ejecuta después de iniciar el servicio."
