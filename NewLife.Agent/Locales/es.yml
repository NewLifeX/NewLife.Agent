"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Nivel de autenticación del panel web. None: sin autenticación; LocalOnly: las solicitudes locales omiten la autenticación; Full: autenticar siempre. Predeterminado LocalOnly."
