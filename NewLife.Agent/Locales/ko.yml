"The web panel is in first-run setup mode. Open {0}://{1}:{2}/ on this machine to set the administrator password.": "웹 패널이 최초 설정 모드입니다. 이 컴퓨터에서 {0}://{1}:{2}/를 열어 관리자 비밀번호를 설정하세요."
"The web management panel started on {0} port {1}.": "웹 관리 패널이 {0} 포트 {1}에서 시작되었습니다."
"Refusing to start: the web panel listens on a non-loopback address without TLS. Keep WebBind=127.0.0.1 and use a reverse proxy or SSH tunnel, or set AllowInsecureRemote=true in the configuration file if you accept the risk.": "시작을 거부했습니다: 웹 패널이 TLS 없이 비루프백 주소에서 수신 대기하고 있습니다. WebBind=127.0.0.1을 유지하고 리버스 프록시 또는 SSH 터널을 사용하거나, 위험을 감수한다면 구성 파일에서 AllowInsecureRemote=true를 설정하세요."
"Refusing to start: the web panel listens on a non-loopback address while still using the default password. Set WebPassword in the configuration file first; first-run setup is only available on 127.0.0.1.": "시작을 거부했습니다: 웹 패널이 기본 비밀번호를 그대로 사용하면서 비루프백 주소에서 수신 대기하고 있습니다. 먼저 구성 파일에서 WebPassword를 설정하세요. 최초 설정은 127.0.0.1에서만 사용할 수 있습니다."
"The web panel is already rebinding, ignore this request.": "웹 패널이 이미 다시 바인딩 중이므로 이 요청을 무시합니다."
"Failed to listen on the new address, rolling back: {0}": "새 주소에서 수신 대기하지 못했습니다. 롤백합니다: {0}"
"Failed to restore the previous address, the web panel is unavailable until the service restarts: {0}": "이전 주소를 복원하지 못했습니다. 서비스가 다시 시작될 때까지 웹 패널을 사용할 수 없습니다: {0}"
"The web management panel has moved to {0}://{1}:{2}.": "웹 관리 패널이 {0}://{1}:{2}(으)로 이동했습니다."
"The web panel password hash has been upgraded to the current work factor.": "웹 패널 비밀번호 해시가 현재 작업 계수로 업그레이드되었습니다."
"Failed to tighten the permission of {0}.": "{0}의 권한을 강화하지 못했습니다."
"Failed to tighten the permission of {0}: {1}": "{0}의 권한을 강화하지 못했습니다: {1}"
"Invalid RestartTimeRange '{0}'; automatic restart is disabled until it is corrected.": "RestartTimeRange '{0}'이(가) 잘못되었습니다. 수정될 때까지 자동 다시 시작이 비활성화됩니다."
"Allow the web panel to listen on a non-loopback address over plain HTTP. Default false; terminate TLS with a reverse proxy or use an SSH tunnel instead.": "웹 패널이 비루프백 주소에서 일반 HTTP로 수신 대기하도록 허용합니다. 기본값은 false이며, 대신 리버스 프록시로 TLS를 처리하거나 SSH 터널을 사용하세요."
"Trust the X-Forwarded-For header from a local reverse proxy. Default false; enabling it lets any local client spoof the header and bypass login rate limiting.": "로컬 리버스 프록시의 X-Forwarded-For 헤더를 신뢰합니다. 기본값은 false이며, 활성화하면 모든 로컬 클라이언트가 헤더를 위조하여 로그인 시도 제한을 우회할 수 있습니다."
