"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "স্বয়ংক্রিয় চালু। Windows-এ, স্বয়ংক্রিয় চালু লগইনের পরে ডেস্কটপে চলে, ব্যাকগ্রাউন্ড সেবা হিসেবে নয়। ডিফল্ট false।"
"Watch interval. Resource usage check period in seconds. Default 10.": "পর্যবেক্ষণ বিরতি। সম্পদ ব্যবহার পরীক্ষার সময়কাল সেকেন্ডে। ডিফল্ট 10।"
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "মেমরি মুক্তির বিরতি। পর্যায়ক্রমে GC চালান এবং ভার্চুয়াল মেমরি মুক্ত করুন, সেকেন্ডে। ডিফল্ট 600।"
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "সর্বোচ্চ মেমরি। ব্যবহার এই মান ছাড়ালে সম্পদ মুক্ত করতে প্রক্রিয়া পুনরায় চালু করুন। ডিফল্ট 0 মানে সীমাহীন।"
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "সর্বোচ্চ থ্রেড সংখ্যা। থ্রেড সংখ্যা এই মান ছাড়ালে সম্পদ মুক্ত করতে প্রক্রিয়া পুনরায় চালু করুন। ডিফল্ট 1000।"
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "সর্বোচ্চ হ্যান্ডেল সংখ্যা। হ্যান্ডেল সংখ্যা এই মান ছাড়ালে সম্পদ মুক্ত করতে প্রক্রিয়া পুনরায় চালু করুন। ডিফল্ট 10000।"
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "স্বয়ংক্রিয় পুনরায় চালু। এই বিরতিতে পৌঁছালে প্রক্রিয়া স্বয়ংক্রিয়ভাবে পুনরায় চালু করুন, মিনিটে। ডিফল্ট 0 মানে সীমাহীন।"
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "স্বয়ংক্রিয় পুনরায় চালুর সময়সীমা। পুনরায় চালু এই সময় উইন্ডোতে সীমাবদ্ধ করুন, বিন্যাস 00:00-06:00। ডিফল্ট সীমাহীন।"
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "ওয়াচডগ। অন্যান্য সেবা রক্ষা করুন এবং প্রতি মিনিটে পরীক্ষা করুন। একাধিক সেবার নাম কমা দিয়ে আলাদা করুন।"
"After start. Command to run after the service starts.": "শুরুর পরে। সেবা চালু হওয়ার পরে চালানোর কমান্ড।"
"Enable the web management panel. Default true.": "ওয়েব ব্যবস্থাপনা প্যানেল সক্ষম করুন। ডিফল্ট true।"
"Web management panel port. Default 5580.": "ওয়েব ব্যবস্থাপনা প্যানেল পোর্ট। ডিফল্ট 5580।"
"Web panel bind address. Default 127.0.0.1 for local access only; set to * to listen on all interfaces, or specify an IP address.": "ওয়েব প্যানেল বাইন্ড ঠিকানা। শুধুমাত্র স্থানীয় অ্যাক্সেসের জন্য ডিফল্ট 127.0.0.1; সমস্ত ইন্টারফেসে শুনতে * সেট করুন বা একটি IP ঠিকানা নির্দিষ্ট করুন।"
"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "ওয়েব প্যানেল প্রমাণীকরণ স্তর। None: কোনো প্রমাণীকরণ নেই; LocalOnly: স্থানীয় অনুরোধ প্রমাণীকরণ বাইপাস করে; Full: সর্বদা প্রমাণীকরণ করুন। ডিফল্ট LocalOnly।"
