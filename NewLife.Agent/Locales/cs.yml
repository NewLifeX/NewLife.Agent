"Invalid RestartTimeRange '{0}'; automatic restart is disabled until it is corrected.": "Neplatná hodnota RestartTimeRange '{0}'; automatický restart je zakázán, dokud nebude opravena."
"Allow the web panel to listen on a non-loopback address over plain HTTP. Default false; terminate TLS with a reverse proxy or use an SSH tunnel instead.": "Umožní webovému panelu naslouchat na nelokální adrese přes prostý HTTP. Výchozí false; ukončete TLS na reverzním proxy nebo použijte SSH tunel."
"Trust the X-Forwarded-For header from a local reverse proxy. Default false; enabling it lets any local client spoof the header and bypass login rate limiting.": "Důvěřovat hlavičce X-Forwarded-For z místního reverzního proxy. Výchozí false; po zapnutí může kterýkoli místní klient hlavičku zfalšovat a obejít omezení přihlášení."
