"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Automatické spuštění. V systému Windows se automatické spuštění spouští na ploše po přihlášení namísto běhu jako služba na pozadí. Výchozí false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Interval sledování. Perioda kontroly využití prostředků v sekundách. Výchozí 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Interval uvolnění paměti. Pravidelně spouštět GC a uvolňovat virtuální paměť, v sekundách. Výchozí 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Maximální paměť. Restartujte proces, když využití překročí tuto hodnotu, aby se uvolnily prostředky. Výchozí 0 znamená neomezeno."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Maximální počet vláken. Restartujte proces, když počet vláken překročí tuto hodnotu, aby se uvolnily prostředky. Výchozí 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Maximální počet popisovačů. Restartujte proces, když počet popisovačů překročí tuto hodnotu, aby se uvolnily prostředky. Výchozí 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Automatický restart. Automaticky restartovat proces po dosažení tohoto intervalu, v minutách. Výchozí 0 znamená neomezeno."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Časové rozmezí automatického restartu. Omezit restarty na toto časové okno, formát 00:00-06:00. Výchozí neomezeno."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. Chránit další služby a kontrolovat každou minutu. Více názvů služeb oddělte čárkami."
