"Unknown command: {0}": "Neznámý příkaz: {0}"
"Refusing to start: set WebPassword in the configuration file first. First-run setup is only available on 127.0.0.1.": "Spuštění odmítnuto: nejprve nastavte WebPassword v konfiguračním souboru. Prvotní nastavení je dostupné pouze na 127.0.0.1."
"The web panel is in first-run setup mode. Open {0}://{1}:{2}/ on this machine to set the administrator password.": "Webový panel je v režimu prvotního nastavení. Otevřete na tomto počítači {0}://{1}:{2}/ a nastavte heslo správce."
"The web management panel started on {0} port {1}.": "Panel webové správy byl spuštěn na portu {1} ({0})."
"Refusing to start: the web panel listens on a non-loopback address without TLS. Keep WebBind=127.0.0.1 and use a reverse proxy or SSH tunnel, or set AllowInsecureRemote=true in the configuration file if you accept the risk.": "Spuštění odmítnuto: webový panel naslouchá bez TLS na nelokální adrese. Ponechte WebBind=127.0.0.1 a použijte reverzní proxy nebo SSH tunel, případně v konfiguračním souboru nastavte AllowInsecureRemote=true, pokud riziko přijímáte."
"Refusing to start: the web panel listens on a non-loopback address while still using the default password. Set WebPassword in the configuration file first; first-run setup is only available on 127.0.0.1.": "Spuštění odmítnuto: webový panel naslouchá na nelokální adrese a stále používá výchozí heslo. Nejprve nastavte WebPassword v konfiguračním souboru; prvotní nastavení je dostupné pouze na 127.0.0.1."
"The web panel is already rebinding, ignore this request.": "Webový panel se již znovu připojuje; tento požadavek se ignoruje."
"Failed to listen on the new address, rolling back: {0}": "Nepodařilo se naslouchat na nové adrese; vrací se zpět: {0}"
"Failed to restore the previous address, the web panel is unavailable until the service restarts: {0}": "Nepodařilo se obnovit předchozí adresu; webový panel nebude dostupný do restartu služby: {0}"
"The web management panel has moved to {0}://{1}:{2}.": "Panel webové správy se přesunul na {0}://{1}:{2}."
"The web panel password hash has been upgraded to the current work factor.": "Hodnota hash hesla webového panelu byla aktualizována na aktuální pracovní faktor."
"Failed to tighten the permission of {0}.": "Nepodařilo se zpřísnit oprávnění k {0}."
