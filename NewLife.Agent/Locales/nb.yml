"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Automatisk start. På Windows startes autorun på skrivebordet etter pålogging i stedet for å kjøre som bakgrunnstjeneste. Standard false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Overvåkingsintervall. Kontrollperiode for ressursbruk i sekunder. Standard 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Intervall for minnefrigjøring. Kjør GC regelmessig og frigjør virtuelt minne, i sekunder. Standard 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Maksimalt minne. Start prosessen på nytt når bruken overstiger denne verdien for å frigjøre ressurser. Standard 0 betyr ubegrenset."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Maksimalt antall tråder. Start prosessen på nytt når antallet tråder overstiger denne verdien for å frigjøre ressurser. Standard 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Maksimalt antall håndtak. Start prosessen på nytt når antallet håndtak overstiger denne verdien for å frigjøre ressurser. Standard 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Automatisk omstart. Start prosessen automatisk på nytt når dette intervallet nås, i minutter. Standard 0 betyr ubegrenset."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Tidsintervall for automatisk omstart. Begrens omstarter til dette tidsvinduet, format 00:00-06:00. Standard ubegrenset."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. Beskytt andre tjenester og kontroller hvert minutt. Skill flere tjenestenavn med komma."
"After start. Command to run after the service starts.": "Etter start. Kommando som kjøres etter at tjenesten starter."
