"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Inicialização automática. No Windows, a inicialização automática é executada na área de trabalho após o login em vez de ser executada como serviço em segundo plano. Padrão false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Intervalo de monitoramento. Período de verificação do uso de recursos, em segundos. Padrão 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Intervalo de liberação de memória. Executar GC periodicamente e liberar memória virtual, em segundos. Padrão 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Memória máxima. Reiniciar o processo quando o uso exceder este valor para liberar recursos. Padrão 0 significa ilimitado."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Número máximo de threads. Reiniciar o processo quando o número de threads exceder este valor para liberar recursos. Padrão 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Número máximo de identificadores. Reiniciar o processo quando o número de identificadores exceder este valor para liberar recursos. Padrão 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Reinicialização automática. Reiniciar automaticamente o processo quando este intervalo for atingido, em minutos. Padrão 0 significa ilimitado."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Intervalo de tempo para reinicialização automática. Restringir reinicializações a esta janela, formato 00:00-06:00. Padrão ilimitado."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. Proteger outros serviços e verificar a cada minuto. Separar vários nomes de serviço com vírgulas."
"After start. Command to run after the service starts.": "Após a inicialização. Comando a executar após a inicialização do serviço."
"Enable the web management panel. Default true.": "Ativar o painel de gerenciamento web. Padrão true."
"Web management panel port. Default 5580.": "Porta do painel de gerenciamento web. Padrão 5580."
"Web panel bind address. Default 127.0.0.1 for local access only; set to * to listen on all interfaces, or specify an IP address.": "Endereço de associação do painel web. Padrão 127.0.0.1 para acesso apenas local; defina * para escutar em todas as interfaces ou especifique um endereço IP."
"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Nível de autenticação do painel web. None: sem autenticação; LocalOnly: solicitações locais ignoram a autenticação; Full: autenticar sempre. Padrão LocalOnly."
"Web panel user name.": "Nome de usuário do painel web."
"Web panel password.": "Senha do painel web."
