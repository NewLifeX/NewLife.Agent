"Refusing to start: the web panel listens on a non-loopback address while still using the default password. Set WebPassword in the configuration file first; first-run setup is only available on 127.0.0.1.": "Từ chối khởi động: bảng điều khiển web lắng nghe trên địa chỉ không phải loopback trong khi vẫn dùng mật khẩu mặc định. Trước tiên hãy đặt WebPassword trong tệp cấu hình; thiết lập lần đầu chỉ khả dụng trên 127.0.0.1."
"The web panel is already rebinding, ignore this request.": "Bảng điều khiển web đang liên kết lại; yêu cầu này sẽ bị bỏ qua."
"Failed to listen on the new address, rolling back: {0}": "Không thể lắng nghe trên địa chỉ mới; đang khôi phục: {0}"
"Failed to restore the previous address, the web panel is unavailable until the service restarts: {0}": "Không khôi phục được địa chỉ trước đó; bảng điều khiển web không khả dụng cho đến khi dịch vụ khởi động lại: {0}"
"The web management panel has moved to {0}://{1}:{2}.": "Bảng điều khiển quản trị web đã chuyển đến {0}://{1}:{2}."
"The web panel password hash has been upgraded to the current work factor.": "Mã băm mật khẩu của bảng điều khiển web đã được nâng cấp lên hệ số công việc hiện tại."
"Failed to tighten the permission of {0}.": "Không thể thắt chặt quyền của {0}."
"Failed to tighten the permission of {0}: {1}": "Không thể thắt chặt quyền của {0}: {1}"
"Invalid RestartTimeRange '{0}'; automatic restart is disabled until it is corrected.": "RestartTimeRange '{0}' không hợp lệ; tự động khởi động lại bị tắt cho đến khi được sửa."
"Allow the web panel to listen on a non-loopback address over plain HTTP. Default false; terminate TLS with a reverse proxy or use an SSH tunnel instead.": "Cho phép bảng điều khiển web lắng nghe trên địa chỉ không phải loopback qua HTTP thường. Mặc định false; hãy kết thúc TLS bằng proxy ngược hoặc dùng đường hầm SSH."
"Trust the X-Forwarded-For header from a local reverse proxy. Default false; enabling it lets any local client spoof the header and bypass login rate limiting.": "Tin cậy tiêu đề X-Forwarded-For từ proxy ngược cục bộ. Mặc định false; khi bật, mọi ứng dụng khách cục bộ đều có thể giả mạo tiêu đề và bỏ qua giới hạn số lần đăng nhập."
