"Service name": "Tên dịch vụ"
"Display name": "Tên hiển thị"
"Service description": "Mô tả dịch vụ"
"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Tự động chạy. Trên Windows, tự động chạy khởi chạy trên màn hình nền sau khi đăng nhập thay vì chạy như dịch vụ nền. Mặc định false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Khoảng thời gian giám sát. Chu kỳ kiểm tra mức sử dụng tài nguyên, tính bằng giây. Mặc định 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Khoảng thời gian giải phóng bộ nhớ. Định kỳ chạy GC và giải phóng bộ nhớ ảo, tính bằng giây. Mặc định 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Bộ nhớ tối đa. Khởi động lại tiến trình khi mức sử dụng vượt quá giá trị này để giải phóng tài nguyên. Mặc định 0 nghĩa là không giới hạn."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Số luồng tối đa. Khởi động lại tiến trình khi số luồng vượt quá giá trị này để giải phóng tài nguyên. Mặc định 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Số handle tối đa. Khởi động lại tiến trình khi số handle vượt quá giá trị này để giải phóng tài nguyên. Mặc định 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Tự động khởi động lại. Tự động khởi động lại tiến trình khi đạt khoảng thời gian này, tính bằng phút. Mặc định 0 nghĩa là không giới hạn."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Khoảng thời gian khởi động lại tự động. Giới hạn khởi động lại trong khung thời gian này, định dạng 00:00-06:00. Mặc định không giới hạn."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. Bảo vệ các dịch vụ khác và kiểm tra mỗi phút. Phân tách nhiều tên dịch vụ bằng dấu phẩy."
"After start. Command to run after the service starts.": "Sau khi khởi động. Lệnh chạy sau khi dịch vụ khởi động."
"Enable the web management panel. Default true.": "Bật bảng quản lý web. Mặc định true."
"Web management panel port. Default 5580.": "Cổng bảng quản lý web. Mặc định 5580."
"Web panel bind address. Default 127.0.0.1 for local access only; set to * to listen on all interfaces, or specify an IP address.": "Địa chỉ liên kết của bảng web. Mặc định 127.0.0.1 chỉ cho truy cập cục bộ; đặt * để lắng nghe trên tất cả giao diện hoặc chỉ định địa chỉ IP."
"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Mức xác thực của bảng web. None: không xác thực; LocalOnly: yêu cầu cục bộ bỏ qua xác thực; Full: luôn xác thực. Mặc định LocalOnly."
