"Refusing to start: set WebPassword in the configuration file first. First-run setup is only available on 127.0.0.1.": "Từ chối khởi động: trước tiên hãy đặt WebPassword trong tệp cấu hình. Thiết lập lần đầu chỉ khả dụng trên 127.0.0.1."
"The web panel is in first-run setup mode. Open {0}://{1}:{2}/ on this machine to set the administrator password.": "Bảng điều khiển web đang ở chế độ thiết lập lần đầu. Mở {0}://{1}:{2}/ trên máy này để đặt mật khẩu quản trị viên."
"The web management panel started on {0} port {1}.": "Bảng điều khiển quản trị web đã khởi động trên cổng {1} ({0})."
