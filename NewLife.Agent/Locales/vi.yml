"Invalid service name for restart: [{0}]": "Tên dịch vụ không hợp lệ để khởi động lại: [{0}]"
"Invalid value for one or more settings.": "Giá trị của một hoặc nhiều cài đặt không hợp lệ."
"Remote access requires AllowInsecureRemote=true in the configuration file. Keep the panel on 127.0.0.1 and use a reverse proxy for TLS, or edit the configuration manually if you accept the risk.": "Truy cập từ xa yêu cầu AllowInsecureRemote=true trong tệp cấu hình. Giữ bảng điều khiển ở 127.0.0.1 và dùng proxy ngược cho TLS, hoặc chỉnh sửa cấu hình thủ công nếu bạn chấp nhận rủi ro."
