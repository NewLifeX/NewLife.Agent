"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Автозапуск. У Windows автозапуск виконується на робочому столі після входу, а не як фонова служба. Типово false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Інтервал моніторингу. Період перевірки використання ресурсів у секундах. Типово 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Інтервал звільнення пам'яті. Періодично запускати GC і звільняти віртуальну пам'ять, у секундах. Типово 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Максимальний обсяг пам'яті. Перезапускати процес, коли використання перевищує це значення, щоб звільнити ресурси. Типово 0 означає без обмежень."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Максимальна кількість потоків. Перезапускати процес, коли кількість потоків перевищує це значення, щоб звільнити ресурси. Типово 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Максимальна кількість дескрипторів. Перезапускати процес, коли кількість дескрипторів перевищує це значення, щоб звільнити ресурси. Типово 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Автоматичний перезапуск. Автоматично перезапускати процес після досягнення цього інтервалу, у хвилинах. Типово 0 означає без обмежень."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Діапазон часу автоматичного перезапуску. Обмежити перезапуски цим вікном, формат 00:00-06:00. Типово без обмежень."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Сторож. Захищати інші служби та перевіряти щохвилини. Кілька назв служб розділяйте комами."
"After start. Command to run after the service starts.": "Після запуску. Команда, що виконується після запуску служби."
"Enable the web management panel. Default true.": "Увімкнути панель веб-керування. Типово true."
"Web management panel port. Default 5580.": "Порт панелі веб-керування. Типово 5580."
"Web panel bind address. Default 127.0.0.1 for local access only; set to * to listen on all interfaces, or specify an IP address.": "Адреса прив'язки веб-панелі. Типово 127.0.0.1 лише для локального доступу; вкажіть * для прослуховування всіх інтерфейсів або задайте IP-адресу."
"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Рівень автентифікації веб-панелі. None: без автентифікації; LocalOnly: локальні запити обходять автентифікацію; Full: завжди автентифікувати. Типово LocalOnly."
