"Installing a Windows service requires administrator privileges.": "安裝 Windows 服務需要管理員權限。"
"Removing a Windows service requires administrator privileges.": "解除安裝 Windows 服務需要管理員權限。"
"Starting a Windows service requires administrator privileges.": "啟動 Windows 服務需要管理員權限。"
"Stopping a Windows service requires administrator privileges.": "停止 Windows 服務需要管理員權限。"
"Invalid WebBind value [{0}]; falling back to listening on loopback 127.0.0.1 only.": "WebBind 設定值 [{0}] 無效；已回退為僅監聽回送位址 127.0.0.1。"
"The web management panel has stopped: {0}": "Web 管理面板已停止：{0}"
"The web panel triggered a service stop.": "Web 面板觸發了服務停止。"
"The service is stopping; the web panel remains available.": "服務正在停止；Web 面板仍可用。"
"The web panel triggered a service start.": "Web 面板觸發了服務啟動。"
"The web panel triggered a service restart.": "Web 面板觸發了服務重新啟動。"
"The service is restarting.": "服務正在重新啟動。"
"The web panel triggered memory release; WorkingSet before release={0} MB.": "Web 面板觸發了記憶體釋放；釋放前 WorkingSet={0} MB。"
"Memory release completed; WorkingSet after release={0} MB, freed {1} MB.": "記憶體釋放完成；釋放後 WorkingSet={0} MB，釋放 {1} MB。"
"Memory release completed: {0} MB -> {1} MB, freed {2} MB.": "記憶體釋放完成：{0} MB -> {1} MB，釋放 {2} MB。"
"Memory release failed.": "記憶體釋放失敗。"
"Configuration updated; some settings take effect after the service restarts.": "設定已更新；部分設定需在服務重新啟動後生效。"
"The web panel password has been changed.": "Web 面板密碼已修改。"
"Password changed; use the new password on your next login.": "密碼已修改；下次登入請使用新密碼。"
"Type {0} does not provide a Cmd value.": "型別 {0} 未提供 Cmd 值。"
"Types {0} and {1} provide the same Cmd value [{2}].": "型別 {0} 與 {1} 提供了相同的 Cmd 值 [{2}]。"
"Service name": "服務名"
"Display name": "顯示名"
"Service description": "服務描述"
"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "使用自動執行。在 Windows 系統上，自動執行是登入後在桌面執行，而不使用背景服務。預設 false。"
"Watch interval. Resource usage check period in seconds. Default 10.": "監控時間間隔。服務資源佔用偵測週期（秒），預設 10。"
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "釋放記憶體間隔。定時執行 GC 並釋放虛擬記憶體（秒），預設 600。"
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "最大佔用記憶體。超過該值時自動重新啟動處理序以釋放資源，預設 0 表示不限。"
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "最大執行緒數。超過該值時自動重新啟動處理序以釋放資源，預設 1000。"
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "最大控制代碼數。超過該值時自動重新啟動處理序以釋放資源，預設 10000。"
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "自動重新啟動時間。到達設定時間時自動重新啟動處理序（分鐘），預設 0 表示不限。"
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "自動重新啟動時間範圍。限制重新啟動只能在此時間段內執行，格式 00:00-06:00，預設不限。"
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "看門狗。保護其他服務，每分鐘檢查一次。多個服務名以逗號分隔。"
"After start. Command to run after the service starts.": "啟動後命令。服務啟動後執行的命令。"
"Enable the web management panel. Default true.": "啟用 Web 面板。預設 true。"
"Web management panel port. Default 5580.": "Web 管理面板連接埠。預設 5580。"
"Web panel bind address. Default 127.0.0.1 for local access only; set to * to listen on all interfaces, or specify an IP address.": "Web 面板繫結位址。預設 127.0.0.1 僅本機存取；設為 * 監聽所有網路卡，也可指定具體 IP。"
"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Web 面板驗證層級。None 不驗證，LocalOnly 本機免驗證，Full 全部驗證。預設 LocalOnly。"
