"Service name": "Nama layanan"
"Display name": "Nama tampilan"
"Service description": "Deskripsi layanan"
"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Jalankan otomatis. Di Windows, jalankan otomatis berjalan di desktop setelah login alih-alih berjalan sebagai layanan latar belakang. Default false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Interval pemantauan. Periode pemeriksaan penggunaan sumber daya dalam detik. Default 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Interval pelepasan memori. Jalankan GC secara berkala dan lepaskan memori virtual, dalam detik. Default 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Memori maksimum. Mulai ulang proses saat penggunaan melebihi nilai ini untuk melepaskan sumber daya. Default 0 berarti tanpa batas."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Jumlah thread maksimum. Mulai ulang proses saat jumlah thread melebihi nilai ini untuk melepaskan sumber daya. Default 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Jumlah handle maksimum. Mulai ulang proses saat jumlah handle melebihi nilai ini untuk melepaskan sumber daya. Default 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Mulai ulang otomatis. Mulai ulang proses secara otomatis saat interval ini tercapai, dalam menit. Default 0 berarti tanpa batas."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Rentang waktu mulai ulang otomatis. Batasi mulai ulang ke jendela waktu ini, format 00:00-06:00. Default tanpa batas."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. Lindungi layanan lain dan periksa setiap menit. Pisahkan beberapa nama layanan dengan koma."
"After start. Command to run after the service starts.": "Setelah mulai. Perintah yang dijalankan setelah layanan dimulai."
"Enable the web management panel. Default true.": "Aktifkan panel manajemen web. Default true."
"Web management panel port. Default 5580.": "Port panel manajemen web. Default 5580."
"Web panel bind address. Default 127.0.0.1 for local access only; set to * to listen on all interfaces, or specify an IP address.": "Alamat pengikatan panel web. Default 127.0.0.1 untuk akses lokal saja; atur ke * untuk mendengarkan di semua antarmuka, atau tentukan alamat IP."
"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Tingkat autentikasi panel web. None: tanpa autentikasi; LocalOnly: permintaan lokal melewati autentikasi; Full: selalu autentikasi. Default LocalOnly."
"Web panel user name.": "Nama pengguna panel web."
"Web panel password.": "Kata sandi panel web."
