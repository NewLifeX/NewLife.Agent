# 日本語 词表（ja）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Simulation is running...": "シミュレーションを実行中..."
"Press any key to stop the simulation.": "任意のキーを押すとシミュレーションを停止します。"
"Service {0} was not found; is it installed?": "サービス {0} が見つかりません。インストールされていますか？"
"Service {0} was stopped; starting it now.": "サービス {0} は停止していました。起動します。"
"Enter a command number: ": "コマンド番号を入力してください: "
"StartWork failed: {0}": "StartWork が失敗しました: {0}"
"StartWork took too long; avoid blocking operations in StartWork.": "StartWork に時間がかかりすぎました。StartWork 内でブロッキング操作を避けてください。"
"Process memory usage {0:n0} MB exceeds the threshold {1:n0} MB; restarting.": "プロセスのメモリ使用量 {0:n0} MB がしきい値 {1:n0} MB を超えました。再起動します。"
"Process thread count {0:n0} exceeds the threshold {1:n0}; restarting.": "プロセスのスレッド数 {0:n0} がしきい値 {1:n0} を超えました。再起動します。"
"Process handle count {0:n0} exceeds the threshold {1:n0}; restarting.": "プロセスのハンドル数 {0:n0} がしきい値 {1:n0} を超えました。再起動します。"
"The web management panel started on port {0}.": "Web 管理パネルがポート {0} で起動しました。"
"Security warning: the web panel listens on all interfaces and still uses the default password; change it as soon as possible.": "セキュリティ警告: Web パネルはすべてのインターフェイスで待ち受けており、既定のパスワードを引き続き使用しています。できるだけ早く変更してください。"
