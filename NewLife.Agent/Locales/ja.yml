"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "自動実行。Windows では、自動実行はログイン後にデスクトップで実行され、バックグラウンドサービスとしては実行されません。既定値 false。"
"Watch interval. Resource usage check period in seconds. Default 10.": "監視間隔。リソース使用状況の確認周期（秒）。既定値 10。"
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "メモリ解放間隔。定期的に GC を実行して仮想メモリを解放します（秒）。既定値 600。"
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "最大メモリ。使用量がこの値を超えたときにプロセスを再起動してリソースを解放します。既定値 0 は無制限です。"
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "最大スレッド数。スレッド数がこの値を超えたときにプロセスを再起動してリソースを解放します。既定値 1000。"
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "最大ハンドル数。ハンドル数がこの値を超えたときにプロセスを再起動してリソースを解放します。既定値 10000。"
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "自動再起動。この間隔に達したときにプロセスを自動的に再起動します（分）。既定値 0 は無制限です。"
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "自動再起動の時間範囲。再起動をこの時間帯に制限します。形式 00:00-06:00。既定値は無制限です。"
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "ウォッチドッグ。他のサービスを保護し、毎分確認します。複数のサービス名はカンマで区切ります。"
"After start. Command to run after the service starts.": "起動後。サービス起動後に実行するコマンド。"
