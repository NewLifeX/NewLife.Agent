"Web panel bind address. Default 127.0.0.1 for local access only; set to * to listen on all interfaces, or specify an IP address.": "Web パネルのバインドアドレス。既定値 127.0.0.1 はローカルアクセスのみ。* を設定するとすべてのインターフェイスで待ち受け、IP アドレスも指定できます。"
"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Web パネルの認証レベル。None: 認証なし; LocalOnly: ローカル要求は認証をバイパス; Full: 常に認証。既定値 LocalOnly。"
