"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "التشغيل التلقائي. في Windows، يعمل التشغيل التلقائي على سطح المكتب بعد تسجيل الدخول بدلاً من العمل كخدمة في الخلفية. الافتراضي false."
"Watch interval. Resource usage check period in seconds. Default 10.": "فترة المراقبة. فترة فحص استخدام الموارد بالثواني. الافتراضي 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "فترة تحرير الذاكرة. تشغيل GC دوريًا وتحرير الذاكرة الافتراضية، بالثواني. الافتراضي 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "الحد الأقصى للذاكرة. إعادة تشغيل العملية عندما يتجاوز الاستخدام هذه القيمة لتحرير الموارد. الافتراضي 0 يعني بلا حد."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "الحد الأقصى لعدد الخيوط. إعادة تشغيل العملية عندما يتجاوز عدد الخيوط هذه القيمة لتحرير الموارد. الافتراضي 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "الحد الأقصى لعدد المقابض. إعادة تشغيل العملية عندما يتجاوز عدد المقابض هذه القيمة لتحرير الموارد. الافتراضي 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "إعادة التشغيل التلقائي. إعادة تشغيل العملية تلقائيًا عند بلوغ هذه الفترة، بالدقائق. الافتراضي 0 يعني بلا حد."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "النطاق الزمني لإعادة التشغيل التلقائي. تقييد عمليات إعادة التشغيل بهذا النطاق، التنسيق 00:00-06:00. الافتراضي بلا حد."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "المراقب. حماية الخدمات الأخرى والفحص كل دقيقة. افصل بين أسماء الخدمات المتعددة بفواصل."
