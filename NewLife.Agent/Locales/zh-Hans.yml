"Simulation started": "模拟运行开始"
"Simulation stopped": "模拟运行停止"
"Run after start: FileName={0} Args={1}": "启动后执行：FileName={0} Args={1}"
"Process: [{0}]{1}": "进程：[{0}]{1}"
"Service started: {0}": "服务启动：{0}"
"Service stopped: {0}": "服务停止：{0}"
"Service has run for {0:n0} minutes, reaching the preset restart interval ({1:n0} minutes) within the configured time range ({2}); restarting!": "服务已运行 {0:n0} 分钟，达到预设重启时间（{1:n0} 分钟），并且当前时间在预设时间范围之内（{2}），准备重启！"
"Service has run for {0:n0} minutes, reaching the preset restart interval ({1:n0} minutes); restarting!": "服务已运行 {0:n0} 分钟，达到预设重启时间（{1:n0} 分钟），准备重启！"
"Exiting service {0} CtrlDispatcher={1}": "退出服务 {0} CtrlDispatcher={1}"
"Error running service {0}: {1}": "运行服务 {0} 出错：{1}"
"Failed to run service {0}: {1}": "运行服务 {0} 失败：{1}"
"Installing a Windows service requires administrator privileges.": "安装 Windows 服务需要管理员权限。"
"Removing a Windows service requires administrator privileges.": "卸载 Windows 服务需要管理员权限。"
"Starting a Windows service requires administrator privileges.": "启动 Windows 服务需要管理员权限。"
"Stopping a Windows service requires administrator privileges.": "停止 Windows 服务需要管理员权限。"
"Invalid WebBind value [{0}]; falling back to listening on loopback 127.0.0.1 only.": "WebBind 配置值 [{0}] 无效；已回退为仅监听环回地址 127.0.0.1。"
"The web management panel has stopped: {0}": "Web 管理面板已停止：{0}"
"The web panel triggered a service stop.": "Web 面板触发了服务停止。"
"The service is stopping; the web panel remains available.": "服务正在停止；Web 面板仍可用。"
"The web panel triggered a service start.": "Web 面板触发了服务启动。"
"The web panel triggered a service restart.": "Web 面板触发了服务重启。"
"The service is restarting.": "服务正在重启。"
"The web panel triggered memory release; WorkingSet before release={0} MB.": "Web 面板触发了内存释放；释放前 WorkingSet={0} MB。"
"Memory release completed; WorkingSet after release={0} MB, freed {1} MB.": "内存释放完成；释放后 WorkingSet={0} MB，释放 {1} MB。"
"Memory release completed: {0} MB -> {1} MB, freed {2} MB.": "内存释放完成：{0} MB -> {1} MB，释放 {2} MB。"
"Memory release failed.": "内存释放失败。"
"Configuration updated; some settings take effect after the service restarts.": "配置已更新；部分设置需在服务重启后生效。"
"The web panel password has been changed.": "Web 面板密码已修改。"
"Password changed; use the new password on your next login.": "密码已修改；下次登录请使用新密码。"
"Type {0} does not provide a Cmd value.": "类型 {0} 未提供 Cmd 值。"
"Types {0} and {1} provide the same Cmd value [{2}].": "类型 {0} 与 {1} 提供了相同的 Cmd 值 [{2}]。"
"Service name": "服务名"
"Display name": "显示名"
"Service description": "服务描述"
"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "使用自动运行。在 Windows 系统上，自动运行是登录后在桌面运行，而不使用后台服务。默认 false。"
"Watch interval. Resource usage check period in seconds. Default 10.": "监控时间间隔。服务资源占用检测周期（秒），默认 10。"
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "释放内存间隔。定时执行 GC 并释放虚拟内存（秒），默认 600。"
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "最大占用内存。超过该值时自动重启进程以释放资源，默认 0 表示不限。"
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "最大线程数。超过该值时自动重启进程以释放资源，默认 1000。"
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "最大句柄数。超过该值时自动重启进程以释放资源，默认 10000。"
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "自动重启时间。到达设定时间时自动重启进程（分钟），默认 0 表示不限。"
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "自动重启时间范围。限制重启只能在此时间段内执行，格式 00:00-06:00，默认不限。"
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "看门狗。保护其它服务，每分钟检查一次。多个服务名用逗号分隔。"
"After start. Command to run after the service starts.": "启动后命令。服务启动后执行的命令。"
"Enable the web management panel. Default true.": "启用 Web 面板。默认 true。"
"Web management panel port. Default 5580.": "Web 管理面板端口。默认 5580。"
"Web panel bind address. Default 127.0.0.1 for local access only; set to * to listen on all interfaces, or specify an IP address.": "Web 面板绑定地址。默认 127.0.0.1 仅本机访问；设为 * 监听所有网卡，也可指定具体 IP。"
"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Web 面板鉴权级别。None 不鉴权，LocalOnly 本地免鉴权，Full 全部鉴权。默认 LocalOnly。"
"Web panel user name.": "Web 面板用户名。"
"Web panel password.": "Web 面板密码。"
"Application started. Hosting environment: {0}": "应用已启动。宿主环境：{0}"
"Application is shutting down...": "应用正在关闭……"
"Menu exited normally": "正常退出菜单"
