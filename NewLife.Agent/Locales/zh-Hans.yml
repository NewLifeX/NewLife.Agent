"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "使用自动运行。在 Windows 系统上，自动运行是登录后在桌面运行，而不使用后台服务。默认 false。"
"Watch interval. Resource usage check period in seconds. Default 10.": "监控时间间隔。服务资源占用检测周期（秒），默认 10。"
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "释放内存间隔。定时执行 GC 并释放虚拟内存（秒），默认 600。"
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "最大占用内存。超过该值时自动重启进程以释放资源，默认 0 表示不限。"
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "最大线程数。超过该值时自动重启进程以释放资源，默认 1000。"
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "最大句柄数。超过该值时自动重启进程以释放资源，默认 10000。"
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "自动重启时间。到达设定时间时自动重启进程（分钟），默认 0 表示不限。"
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "自动重启时间范围。限制重启只能在此时间段内执行，格式 00:00-06:00，默认不限。"
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "看门狗。保护其它服务，每分钟检查一次。多个服务名用逗号分隔。"
"After start. Command to run after the service starts.": "启动后命令。服务启动后执行的命令。"
