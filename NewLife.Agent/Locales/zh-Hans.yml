"Web panel bind address. Default 127.0.0.1 for local access only; set to * to listen on all interfaces, or specify an IP address.": "Web 面板绑定地址。默认 127.0.0.1 仅本机访问；设为 * 监听所有网卡，也可指定具体 IP。"
"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Web 面板鉴权级别。None 不鉴权，LocalOnly 本地免鉴权，Full 全部鉴权。默认 LocalOnly。"
