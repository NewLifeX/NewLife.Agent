"Trust the X-Forwarded-For header from a local reverse proxy. Default false; enabling it lets any local client spoof the header and bypass login rate limiting.": "信任本地反向代理传来的 X-Forwarded-For 头。默认 false；启用后任何本地客户端都可伪造该头，绕过登录限流。"
