"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Уровень аутентификации веб-панели. None: без аутентификации; LocalOnly: локальные запросы обходят аутентификацию; Full: всегда аутентифицировать. По умолчанию LocalOnly."
