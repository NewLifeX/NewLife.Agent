"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Автозапуск. В Windows автозапуск выполняется на рабочем столе после входа в систему, а не как фоновая служба. По умолчанию false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Интервал мониторинга. Период проверки использования ресурсов в секундах. По умолчанию 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Интервал освобождения памяти. Периодически запускать GC и освобождать виртуальную память, в секундах. По умолчанию 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Максимальный объём памяти. Перезапускать процесс при превышении этого значения для освобождения ресурсов. По умолчанию 0 означает без ограничений."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Максимальное число потоков. Перезапускать процесс при превышении этого значения для освобождения ресурсов. По умолчанию 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Максимальное число дескрипторов. Перезапускать процесс при превышении этого значения для освобождения ресурсов. По умолчанию 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Автоматический перезапуск. Автоматически перезапускать процесс по достижении этого интервала, в минутах. По умолчанию 0 означает без ограничений."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Диапазон времени автоматического перезапуска. Ограничить перезапуски этим окном, формат 00:00-06:00. По умолчанию без ограничений."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Сторож. Защищать другие службы и проверять каждую минуту. Несколько имён служб разделяйте запятыми."
"After start. Command to run after the service starts.": "После запуска. Команда, выполняемая после запуска службы."
