"Failed to tighten the permission of {0}: {1}": "محدودکردن مجوزهای {0} ناموفق بود: {1}"
"Invalid RestartTimeRange '{0}'; automatic restart is disabled until it is corrected.": "مقدار RestartTimeRange «{0}» نامعتبر است؛ راه‌اندازی مجدد خودکار تا اصلاح آن غیرفعال است."
"Allow the web panel to listen on a non-loopback address over plain HTTP. Default false; terminate TLS with a reverse proxy or use an SSH tunnel instead.": "به پنل وب اجازه می‌دهد روی یک نشانی غیرلوکال با HTTP ساده گوش دهد. پیش‌فرض false؛ به‌جای آن TLS را با پراکسی معکوس پایان دهید یا از تونل SSH استفاده کنید."
"Trust the X-Forwarded-For header from a local reverse proxy. Default false; enabling it lets any local client spoof the header and bypass login rate limiting.": "به سرآیند X-Forwarded-For از پراکسی معکوس محلی اعتماد می‌کند. پیش‌فرض false؛ با فعال‌کردن آن هر کلاینت محلی می‌تواند سرآیند را جعل کند و محدودیت تلاش ورود را دور بزند."
