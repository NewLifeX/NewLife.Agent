"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "اجرای خودکار. در ویندوز، اجرای خودکار پس از ورود روی دسکتاپ اجرا می‌شود نه به‌عنوان سرویس پس‌زمینه. پیش‌فرض false."
"Watch interval. Resource usage check period in seconds. Default 10.": "بازه پایش. دوره بررسی استفاده از منابع به ثانیه. پیش‌فرض 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "بازه آزادسازی حافظه. اجرای دوره‌ای GC و آزادسازی حافظه مجازی، به ثانیه. پیش‌فرض 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "حداکثر حافظه. وقتی استفاده از این مقدار فراتر رفت، فرآیند را برای آزادسازی منابع دوباره راه‌اندازی کن. پیش‌فرض 0 یعنی نامحدود."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "حداکثر تعداد رشته. وقتی تعداد رشته‌ها از این مقدار فراتر رفت، فرآیند را برای آزادسازی منابع دوباره راه‌اندازی کن. پیش‌فرض 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "حداکثر تعداد دستگیره. وقتی تعداد دستگیره‌ها از این مقدار فراتر رفت، فرآیند را برای آزادسازی منابع دوباره راه‌اندازی کن. پیش‌فرض 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "راه‌اندازی مجدد خودکار. با رسیدن به این بازه، فرآیند را به‌طور خودکار دوباره راه‌اندازی کن، به دقیقه. پیش‌فرض 0 یعنی نامحدود."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "بازه زمانی راه‌اندازی مجدد خودکار. راه‌اندازی‌های مجدد را به این بازه محدود کن، قالب 00:00-06:00. پیش‌فرض نامحدود."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "نگهبان. از سرویس‌های دیگر محافظت کن و هر دقیقه بررسی کن. چند نام سرویس را با کاما جدا کن."
"After start. Command to run after the service starts.": "پس از راه‌اندازی. فرمانی که پس از راه‌اندازی سرویس اجرا می‌شود."
"Enable the web management panel. Default true.": "فعال‌سازی پنل مدیریت وب. پیش‌فرض true."
