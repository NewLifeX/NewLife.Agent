"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "سطح احراز هویت پنل وب. None: بدون احراز هویت؛ LocalOnly: درخواست‌های محلی از احراز هویت عبور می‌کنند؛ Full: همیشه احراز هویت کن. پیش‌فرض LocalOnly."
