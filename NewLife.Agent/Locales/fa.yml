"The web panel is in first-run setup mode. Open {0}://{1}:{2}/ on this machine to set the administrator password.": "پنل وب در حالت راه‌اندازی اولیه است. برای تعیین رمز عبور مدیر، {0}://{1}:{2}/ را روی این دستگاه باز کنید."
"The web management panel started on {0} port {1}.": "پنل مدیریت وب روی پورت {1} ({0}) راه‌اندازی شد."
