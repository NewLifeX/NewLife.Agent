"Refusing to start: the web panel listens on a non-loopback address while still using the default password. Set WebPassword in the configuration file first; first-run setup is only available on 127.0.0.1.": "شروع رد شد: پنل وب روی یک نشانی غیرلوکال گوش می‌دهد و هنوز از رمز عبور پیش‌فرض استفاده می‌کند. ابتدا WebPassword را در فایل پیکربندی تنظیم کنید؛ راه‌اندازی اولیه فقط روی 127.0.0.1 در دسترس است."
"The web panel is already rebinding, ignore this request.": "پنل وب از قبل در حال اتصال مجدد است؛ این درخواست نادیده گرفته می‌شود."
"Failed to listen on the new address, rolling back: {0}": "شنیدن روی نشانی جدید ناموفق بود؛ بازگردانی انجام می‌شود: {0}"
"Failed to restore the previous address, the web panel is unavailable until the service restarts: {0}": "بازگردانی نشانی قبلی ناموفق بود؛ پنل وب تا راه‌اندازی مجدد سرویس در دسترس نیست: {0}"
