"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Automatisch starten. Unter Windows startet der Autorun nach der Anmeldung auf dem Desktop, statt als Hintergrunddienst zu laufen. Standard false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Überwachungsintervall. Prüfzyklus der Ressourcennutzung in Sekunden. Standard 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Intervall zur Speicherfreigabe. Regelmäßig GC ausführen und virtuellen Speicher freigeben, in Sekunden. Standard 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Maximaler Speicher. Prozess neu starten, wenn die Nutzung diesen Wert überschreitet, um Ressourcen freizugeben. Standard 0 bedeutet unbegrenzt."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Maximale Threadanzahl. Prozess neu starten, wenn die Threadanzahl diesen Wert überschreitet, um Ressourcen freizugeben. Standard 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Maximale Handleanzahl. Prozess neu starten, wenn die Handleanzahl diesen Wert überschreitet, um Ressourcen freizugeben. Standard 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Automatischer Neustart. Prozess automatisch neu starten, wenn dieses Intervall erreicht ist, in Minuten. Standard 0 bedeutet unbegrenzt."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Zeitfenster für automatischen Neustart. Neustarts auf dieses Zeitfenster beschränken, Format 00:00-06:00. Standard unbegrenzt."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. Andere Dienste schützen und jede Minute prüfen. Mehrere Dienstnamen durch Kommas trennen."
"After start. Command to run after the service starts.": "Nach dem Start. Befehl, der nach dem Start des Dienstes ausgeführt wird."
