"Invalid RestartTimeRange '{0}'; automatic restart is disabled until it is corrected.": "Ungültiger RestartTimeRange '{0}'; der automatische Neustart ist deaktiviert, bis der Wert korrigiert ist."
"Allow the web panel to listen on a non-loopback address over plain HTTP. Default false; terminate TLS with a reverse proxy or use an SSH tunnel instead.": "Erlaubt dem Webpanel, über einfaches HTTP auf einer Nicht-Loopback-Adresse zu lauschen. Standard false; TLS stattdessen mit einem Reverse-Proxy terminieren oder einen SSH-Tunnel verwenden."
"Trust the X-Forwarded-For header from a local reverse proxy. Default false; enabling it lets any local client spoof the header and bypass login rate limiting.": "Vertraut dem X-Forwarded-For-Header eines lokalen Reverse-Proxys. Standard false; wenn aktiviert, kann jeder lokale Client den Header fälschen und die Anmeldebegrenzung umgehen."
