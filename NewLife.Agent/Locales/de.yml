"Refusing to start: the web panel listens on a non-loopback address without TLS. Keep WebBind=127.0.0.1 and use a reverse proxy or SSH tunnel, or set AllowInsecureRemote=true in the configuration file if you accept the risk.": "Start abgelehnt: Das Webpanel lauscht ohne TLS auf einer Nicht-Loopback-Adresse. Behalten Sie WebBind=127.0.0.1 und verwenden Sie einen Reverse-Proxy oder SSH-Tunnel, oder setzen Sie AllowInsecureRemote=true in der Konfigurationsdatei, wenn Sie das Risiko akzeptieren."
"Refusing to start: the web panel listens on a non-loopback address while still using the default password. Set WebPassword in the configuration file first; first-run setup is only available on 127.0.0.1.": "Start abgelehnt: Das Webpanel lauscht auf einer Nicht-Loopback-Adresse und verwendet noch das Standardkennwort. Legen Sie zuerst WebPassword in der Konfigurationsdatei fest; die Ersteinrichtung ist nur auf 127.0.0.1 verfügbar."
