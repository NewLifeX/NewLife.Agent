"The web panel is in first-run setup mode. Open {0}://{1}:{2}/ on this machine to set the administrator password.": "Das Webpanel befindet sich im Ersteinrichtungsmodus. Öffnen Sie {0}://{1}:{2}/ auf diesem Rechner, um das Administratorkennwort festzulegen."
