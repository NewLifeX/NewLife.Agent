"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Automaattisen uudelleenkäynnistyksen aikaväli. Rajoita uudelleenkäynnistykset tähän aikaväliin, muoto 00:00-06:00. Oletus rajoittamaton."
