"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Automaattinen käynnistys. Windowsissa automaattinen käynnistys käynnistyy työpöydällä kirjautumisen jälkeen taustapalvelun sijaan. Oletus false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Seurantaväli. Resurssien käytön tarkistusjakso sekunteina. Oletus 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Muistin vapautuksen väli. Suorita GC säännöllisesti ja vapauta virtuaalimuisti, sekunteina. Oletus 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Enimmäismuisti. Käynnistä prosessi uudelleen, kun käyttö ylittää tämän arvon resurssien vapauttamiseksi. Oletus 0 tarkoittaa rajoittamatonta."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Enimmäissäikeiden määrä. Käynnistä prosessi uudelleen, kun säikeiden määrä ylittää tämän arvon resurssien vapauttamiseksi. Oletus 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Enimmäiskahvojen määrä. Käynnistä prosessi uudelleen, kun kahvojen määrä ylittää tämän arvon resurssien vapauttamiseksi. Oletus 10000."
