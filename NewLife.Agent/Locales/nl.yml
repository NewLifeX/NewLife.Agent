"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Automatisch starten. Op Windows start autorun na aanmelding op het bureaublad in plaats van als achtergrondservice. Standaard false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Controle-interval. Controleperiode voor resourcegebruik in seconden. Standaard 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Interval voor geheugenvrijgave. Voer periodiek GC uit en geef virtueel geheugen vrij, in seconden. Standaard 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Maximaal geheugen. Start het proces opnieuw wanneer het gebruik deze waarde overschrijdt om resources vrij te geven. Standaard 0 betekent onbeperkt."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Maximaal aantal threads. Start het proces opnieuw wanneer het aantal threads deze waarde overschrijdt om resources vrij te geven. Standaard 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Maximaal aantal handles. Start het proces opnieuw wanneer het aantal handles deze waarde overschrijdt om resources vrij te geven. Standaard 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Automatisch herstarten. Start het proces automatisch opnieuw wanneer dit interval is bereikt, in minuten. Standaard 0 betekent onbeperkt."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Tijdvenster voor automatisch herstarten. Beperk herstarts tot dit tijdvenster, formaat 00:00-06:00. Standaard onbeperkt."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. Bescherm andere services en controleer elke minuut. Scheid meerdere servicenamen met komma's."
"After start. Command to run after the service starts.": "Na start. Opdracht die na het starten van de service wordt uitgevoerd."
