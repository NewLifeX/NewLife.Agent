"Refusing to start: the web panel listens on a non-loopback address while still using the default password. Set WebPassword in the configuration file first; first-run setup is only available on 127.0.0.1.": "Avvio rifiutato: il pannello web è in ascolto su un indirizzo non locale e usa ancora la password predefinita. Imposta prima WebPassword nel file di configurazione; la configurazione iniziale è disponibile solo su 127.0.0.1."
"The web panel is already rebinding, ignore this request.": "Il pannello web sta già eseguendo il rebind; questa richiesta viene ignorata."
