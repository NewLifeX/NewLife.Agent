"Invalid RestartTimeRange '{0}'; automatic restart is disabled until it is corrected.": "RestartTimeRange '{0}' non valido; il riavvio automatico è disabilitato finché non viene corretto."
"Allow the web panel to listen on a non-loopback address over plain HTTP. Default false; terminate TLS with a reverse proxy or use an SSH tunnel instead.": "Consente al pannello web di ascoltare su un indirizzo non locale tramite HTTP semplice. Predefinito false; terminare TLS con un reverse proxy o usare un tunnel SSH."
"Trust the X-Forwarded-For header from a local reverse proxy. Default false; enabling it lets any local client spoof the header and bypass login rate limiting.": "Considera attendibile l'intestazione X-Forwarded-For proveniente da un reverse proxy locale. Predefinito false; se abilitato, qualsiasi client locale può falsificare l'intestazione e aggirare il limite dei tentativi di accesso."
