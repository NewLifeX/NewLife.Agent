"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Avvio automatico. In Windows l'avvio automatico viene eseguito sul desktop dopo l'accesso invece di essere eseguito come servizio in background. Predefinito false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Intervallo di monitoraggio. Periodo di controllo dell'utilizzo delle risorse, in secondi. Predefinito 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Intervallo di rilascio memoria. Esegui periodicamente GC e rilascia la memoria virtuale, in secondi. Predefinito 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Memoria massima. Riavvia il processo quando l'utilizzo supera questo valore per liberare risorse. Predefinito 0 significa illimitato."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Numero massimo di thread. Riavvia il processo quando il numero di thread supera questo valore per liberare risorse. Predefinito 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Numero massimo di handle. Riavvia il processo quando il numero di handle supera questo valore per liberare risorse. Predefinito 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Riavvio automatico. Riavvia automaticamente il processo quando viene raggiunto questo intervallo, in minuti. Predefinito 0 significa illimitato."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Intervallo orario di riavvio automatico. Limita i riavvii a questa finestra, formato 00:00-06:00. Predefinito illimitato."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. Proteggi altri servizi e controlla ogni minuto. Separa più nomi di servizio con virgole."
"After start. Command to run after the service starts.": "Dopo l'avvio. Comando da eseguire dopo l'avvio del servizio."
"Enable the web management panel. Default true.": "Abilita il pannello di gestione web. Predefinito true."
"Web management panel port. Default 5580.": "Porta del pannello di gestione web. Predefinito 5580."
"Web panel bind address. Default 127.0.0.1 for local access only; set to * to listen on all interfaces, or specify an IP address.": "Indirizzo di associazione del pannello web. Predefinito 127.0.0.1 per accesso solo locale; impostare * per ascoltare tutte le interfacce o specificare un indirizzo IP."
"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Livello di autenticazione del pannello web. None: nessuna autenticazione; LocalOnly: le richieste locali non richiedono autenticazione; Full: autentica sempre. Predefinito LocalOnly."
