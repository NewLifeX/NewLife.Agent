"The web panel is in first-run setup mode. Open {0}://{1}:{2}/ on this machine to set the administrator password.": "פאנל האינטרנט נמצא במצב הגדרה ראשונית. פתחו {0}://{1}:{2}/ במחשב זה כדי להגדיר סיסמת מנהל."
