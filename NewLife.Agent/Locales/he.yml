"Failed to run service {0}: {1}": "הפעלת שירות {0} נכשלה: {1}"
"Installing a Windows service requires administrator privileges.": "התקנת שירות Windows דורשת הרשאות מנהל."
"Removing a Windows service requires administrator privileges.": "הסרת שירות Windows דורשת הרשאות מנהל."
"Starting a Windows service requires administrator privileges.": "הפעלת שירות Windows דורשת הרשאות מנהל."
"Stopping a Windows service requires administrator privileges.": "עצירת שירות Windows דורשת הרשאות מנהל."
"Invalid WebBind value [{0}]; falling back to listening on loopback 127.0.0.1 only.": "ערך WebBind [{0}] אינו חוקי; מאזין כעת רק לכתובת ה-loopback 127.0.0.1."
"The web management panel has stopped: {0}": "לוח ניהול האינטרנט הופסק: {0}"
"The web panel triggered a service stop.": "לוח האינטרנט הפעיל עצירת שירות."
"The service is stopping; the web panel remains available.": "השירות נעצר; לוח האינטרנט עדיין זמין."
"The web panel triggered a service start.": "לוח האינטרנט הפעיל התחלת שירות."
"The web panel triggered a service restart.": "לוח האינטרנט הפעיל הפעלה מחדש של השירות."
"The service is restarting.": "השירות מופעל מחדש."
"The web panel triggered memory release; WorkingSet before release={0} MB.": "לוח האינטרנט הפעיל שחרור זיכרון; WorkingSet לפני השחרור={0} MB."
"Memory release completed; WorkingSet after release={0} MB, freed {1} MB.": "שחרור הזיכרון הושלם; WorkingSet לאחר השחרור={0} MB, שוחררו {1} MB."
"Memory release completed: {0} MB -> {1} MB, freed {2} MB.": "שחרור הזיכרון הושלם: {0} MB -> {1} MB, שוחררו {2} MB."
"Memory release failed.": "שחרור הזיכרון נכשל."
"Configuration updated; some settings take effect after the service restarts.": "התצורה עודכנה; חלק מההגדרות ייכנסו לתוקף לאחר הפעלה מחדש של השירות."
"The web panel password has been changed.": "סיסמת לוח האינטרנט שונתה."
"Password changed; use the new password on your next login.": "הסיסמה שונתה; השתמש בסיסמה החדשה בכניסה הבאה."
"Type {0} does not provide a Cmd value.": "הסוג {0} אינו מספק ערך Cmd."
"Types {0} and {1} provide the same Cmd value [{2}].": "הסוגים {0} ו-{1} מספקים את אותו ערך Cmd [{2}]."
"Service name": "שם השירות"
"Display name": "שם תצוגה"
"Service description": "תיאור השירות"
"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "הפעלה אוטומטית. ב-Windows, הפעלה אוטומטית פועלת על שולחן העבודה לאחר הכניסה במקום לפעול כשירות רקע. ברירת מחדל false."
"Watch interval. Resource usage check period in seconds. Default 10.": "מרווח ניטור. תקופת בדיקת השימוש במשאבים בשניות. ברירת מחדל 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "מרווח שחרור זיכרון. הפעלת GC תקופתית ושחרור זיכרון וירטואלי, בשניות. ברירת מחדל 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "זיכרון מקסימלי. הפעל מחדש את התהליך כאשר השימוש עולה על ערך זה כדי לשחרר משאבים. ברירת מחדל 0 פירושה ללא הגבלה."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "מספר תהליכונים מקסימלי. הפעל מחדש את התהליך כאשר מספר התהליכונים עולה על ערך זה כדי לשחרר משאבים. ברירת מחדל 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "מספר ידיות מקסימלי. הפעל מחדש את התהליך כאשר מספר הידיות עולה על ערך זה כדי לשחרר משאבים. ברירת מחדל 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "הפעלה מחדש אוטומטית. הפעל מחדש את התהליך אוטומטית בהגעה למרווח זה, בדקות. ברירת מחדל 0 פירושה ללא הגבלה."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "טווח זמן להפעלה מחדש אוטומטית. הגבל הפעלות מחדש לחלון זמן זה, תבנית 00:00-06:00. ברירת מחדל ללא הגבלה."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. הגן על שירותים אחרים ובדוק כל דקה. הפרד בין שמות שירותים מרובים בפסיקים."
"After start. Command to run after the service starts.": "לאחר ההפעלה. פקודה להרצה לאחר הפעלת השירות."
"Enable the web management panel. Default true.": "אפשר את פאנל ניהול האינטרנט. ברירת מחדל true."
"Web management panel port. Default 5580.": "יציאת פאנל ניהול האינטרנט. ברירת מחדל 5580."
"Web panel bind address. Default 127.0.0.1 for local access only; set to * to listen on all interfaces, or specify an IP address.": "כתובת הכריכה של פאנל האינטרנט. ברירת מחדל 127.0.0.1 לגישה מקומית בלבד; הגדר * כדי להאזין לכל הממשקים או ציין כתובת IP."
"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "רמת אימות של פאנל האינטרנט. None: ללא אימות; LocalOnly: בקשות מקומיות עוקפות אימות; Full: תמיד לאמת. ברירת מחדל LocalOnly."
"Web panel user name.": "שם המשתמש של פאנל האינטרנט."
"Web panel password.": "סיסמת פאנל האינטרנט."
"Application started. Hosting environment: {0}": "האפליקציה הופעלה. סביבת אירוח: {0}"
"Application is shutting down...": "האפליקציה נסגרת..."
"Menu exited normally": "התפריט נסגר כרגיל"
