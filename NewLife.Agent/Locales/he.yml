"Service has run for {0:n0} minutes, reaching the preset restart interval ({1:n0} minutes); restarting!": "השירות פועל כבר {0:n0} דקות והגיע למרווח האתחול שהוגדר מראש ({1:n0} דקות); מפעיל מחדש!"
