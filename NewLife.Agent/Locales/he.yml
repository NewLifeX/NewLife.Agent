"Failed to tighten the permission of {0}: {1}": "החמרת ההרשאות של {0} נכשלה: {1}"
"Invalid RestartTimeRange '{0}'; automatic restart is disabled until it is corrected.": "RestartTimeRange '{0}' אינו חוקי; הפעלה מחדש אוטומטית מושבתת עד לתיקונו."
"Allow the web panel to listen on a non-loopback address over plain HTTP. Default false; terminate TLS with a reverse proxy or use an SSH tunnel instead.": "מאפשר לפאנל האינטרנט להאזין בכתובת שאינה מקומית באמצעות HTTP רגיל. ברירת המחדל false; סיימו TLS באמצעות פרוקסי הפוך או השתמשו במנהרת SSH."
"Trust the X-Forwarded-For header from a local reverse proxy. Default false; enabling it lets any local client spoof the header and bypass login rate limiting.": "לסמוך על כותרת X-Forwarded-For מפרוקסי הפוך מקומי. ברירת המחדל false; כאשר מופעל, כל לקוח מקומי יכול לזייף את הכותרת ולעקוף את הגבלת ניסיונות ההתחברות."
