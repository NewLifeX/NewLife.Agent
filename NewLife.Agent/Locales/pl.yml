# Polski 词表（pl）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Simulation is running...": "Symulacja jest uruchomiona..."
"Press any key to stop the simulation.": "Naciśnij dowolny klawisz, aby zatrzymać symulację."
"Service {0} was not found; is it installed?": "Nie znaleziono usługi {0}; czy jest zainstalowana?"
"Service {0} was stopped; starting it now.": "Usługa {0} była zatrzymana; uruchamiam ją teraz."
"Enter a command number: ": "Wprowadź numer polecenia: "
"StartWork failed: {0}": "StartWork nie powiodło się: {0}"
"StartWork took too long; avoid blocking operations in StartWork.": "StartWork trwało zbyt długo; unikaj operacji blokujących w StartWork."
"Process memory usage {0:n0} MB exceeds the threshold {1:n0} MB; restarting.": "Użycie pamięci procesu {0:n0} MB przekracza próg {1:n0} MB; ponowne uruchomienie."
"Process thread count {0:n0} exceeds the threshold {1:n0}; restarting.": "Liczba wątków procesu {0:n0} przekracza próg {1:n0}; ponowne uruchomienie."
"Process handle count {0:n0} exceeds the threshold {1:n0}; restarting.": "Liczba uchwytów procesu {0:n0} przekracza próg {1:n0}; ponowne uruchomienie."
"The web management panel started on port {0}.": "Panel administracji sieciowej uruchomił się na porcie {0}."
"Security warning: the web panel listens on all interfaces and still uses the default password; change it as soon as possible.": "Ostrzeżenie bezpieczeństwa: panel sieciowy nasłuchuje na wszystkich interfejsach i nadal używa domyślnego hasła; zmień je jak najszybciej."
"Invalid command number [{0}]; please try again.": "Nieprawidłowy numer polecenia [{0}]; spróbuj ponownie."
"No.\tFunction\tCommand line": "Nr\tFunkcja\tWiersz polecenia"
" {0}. {1}\t{2}": " {0}. {1}\t{2}"
" {0}. {1}\t": " {0}. {1}\t"
" Web management: http://localhost:{0}/": " Zarządzanie siecią: http://localhost:{0}/"
" 0. Exit\t": " 0. Wyjście\t"
"Service: {0}({1})": "Usługa: {0}({1})"
"Service: {0}": "Usługa: {0}"
"Description: {0}": "Opis: {0}"
"Status: {0} ": "Stan: {0} "
"Not installed": "Nie zainstalowano"
"Running": "Działa"
"Stopped": "Zatrzymana"
" ({0})": " ({0})"
"Administrator": "Administrator"
"Standard user": "Użytkownik standardowy"
"Path: {0}": "Ścieżka: {0}"
"{0}\tVersion: {1}\tReleased: {2:yyyy-MM-dd HH:mm:ss}": "{0}\tWersja: {1}\tOpublikowano: {2:yyyy-MM-dd HH:mm:ss}"
"Show status": "Pokaż stan"
"Install service": "Zainstaluj usługę"
"Install and start service": "Zainstaluj i uruchom usługę"
"Reinstall service": "Zainstaluj ponownie usługę"
"Remove service": "Usuń usługę"
"Restart service": "Uruchom ponownie usługę"
"Run service": "Uruchom usługę"
"Simulation": "Symulacja"
"Start service": "Uruchom usługę"
"Stop service": "Zatrzymaj usługę"
"Stop and remove service": "Zatrzymaj i usuń usługę"
"Watchdog service protection": "Ochrona usługi przez watchdog"
"Simulation started": "Symulacja uruchomiona"
"Simulation stopped": "Symulacja zatrzymana"
"Run after start: FileName={0} Args={1}": "Uruchom po starcie: FileName={0} Args={1}"
"Process: [{0}]{1}": "Proces: [{0}]{1}"
"Service started: {0}": "Usługa uruchomiona: {0}"
"Service stopped: {0}": "Usługa zatrzymana: {0}"
"Service has run for {0:n0} minutes, reaching the preset restart interval ({1:n0} minutes) within the configured time range ({2}); restarting!": "Usługa działa od {0:n0} minut i osiągnęła wstępnie ustawiony interwał ponownego uruchomienia ({1:n0} minut) w skonfigurowanym przedziale czasu ({2}); ponowne uruchomienie!"
"Service has run for {0:n0} minutes, reaching the preset restart interval ({1:n0} minutes); restarting!": "Usługa działa od {0:n0} minut i osiągnęła wstępnie ustawiony interwał ponownego uruchomienia ({1:n0} minut); ponowne uruchomienie!"
"Exiting service {0} CtrlDispatcher={1}": "Zamykanie usługi {0}, CtrlDispatcher={1}"
"Error running service {0}: {1}": "Błąd podczas uruchamiania usługi {0}: {1}"
"Failed to run service {0}: {1}": "Nie udało się uruchomić usługi {0}: {1}"
"Installing a Windows service requires administrator privileges.": "Instalacja usługi Windows wymaga uprawnień administratora."
"Removing a Windows service requires administrator privileges.": "Usunięcie usługi Windows wymaga uprawnień administratora."
"Starting a Windows service requires administrator privileges.": "Uruchomienie usługi Windows wymaga uprawnień administratora."
"Stopping a Windows service requires administrator privileges.": "Zatrzymanie usługi Windows wymaga uprawnień administratora."
"Invalid WebBind value [{0}]; falling back to listening on loopback 127.0.0.1 only.": "Nieprawidłowa wartość WebBind [{0}]; nasłuchiwanie tylko na adresie pętli zwrotnej 127.0.0.1."
"The web management panel has stopped: {0}": "Panel zarządzania siecią został zatrzymany: {0}"
"The web panel triggered a service stop.": "Panel sieciowy wywołał zatrzymanie usługi."
"The service is stopping; the web panel remains available.": "Usługa jest zatrzymywana; panel sieciowy pozostaje dostępny."
"The web panel triggered a service start.": "Panel sieciowy wywołał uruchomienie usługi."
"The web panel triggered a service restart.": "Panel sieciowy wywołał ponowne uruchomienie usługi."
"The service is restarting.": "Usługa jest ponownie uruchamiana."
"The web panel triggered memory release; WorkingSet before release={0} MB.": "Panel sieciowy wywołał zwolnienie pamięci; WorkingSet przed zwolnieniem={0} MB."
"Memory release completed; WorkingSet after release={0} MB, freed {1} MB.": "Zwolnienie pamięci zakończone; WorkingSet po zwolnieniu={0} MB, zwolniono {1} MB."
"Memory release completed: {0} MB -> {1} MB, freed {2} MB.": "Zwolnienie pamięci zakończone: {0} MB -> {1} MB, zwolniono {2} MB."
"Memory release failed.": "Zwolnienie pamięci nie powiodło się."
"Configuration updated; some settings take effect after the service restarts.": "Konfiguracja zaktualizowana; niektóre ustawienia zaczną obowiązywać po ponownym uruchomieniu usługi."
"The web panel password has been changed.": "Hasło panelu sieciowego zostało zmienione."
"Password changed; use the new password on your next login.": "Hasło zmienione; przy następnym logowaniu użyj nowego hasła."
"Type {0} does not provide a Cmd value.": "Typ {0} nie podaje wartości Cmd."
"Types {0} and {1} provide the same Cmd value [{2}].": "Typy {0} i {1} podają tę samą wartość Cmd [{2}]."
"Service name": "Nazwa usługi"
"Display name": "Nazwa wyświetlana"
"Service description": "Opis usługi"
"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Automatyczne uruchamianie. W systemie Windows autostart uruchamia się na pulpicie po zalogowaniu, zamiast działać jako usługa w tle. Domyślnie false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Interwał monitorowania. Okres sprawdzania użycia zasobów w sekundach. Domyślnie 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Interwał zwalniania pamięci. Okresowe uruchamianie GC i zwalnianie pamięci wirtualnej, w sekundach. Domyślnie 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Maksymalna pamięć. Uruchom ponownie proces, gdy użycie przekroczy tę wartość, aby zwolnić zasoby. Domyślnie 0 oznacza brak limitu."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Maksymalna liczba wątków. Uruchom ponownie proces, gdy liczba wątków przekroczy tę wartość, aby zwolnić zasoby. Domyślnie 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Maksymalna liczba uchwytów. Uruchom ponownie proces, gdy liczba uchwytów przekroczy tę wartość, aby zwolnić zasoby. Domyślnie 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Automatyczne ponowne uruchomienie. Automatycznie uruchom ponownie proces po osiągnięciu tego interwału, w minutach. Domyślnie 0 oznacza brak limitu."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Zakres czasu automatycznego ponownego uruchamiania. Ogranicz ponowne uruchomienia do tego okna czasowego, format 00:00-06:00. Domyślnie bez limitu."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. Ochrona innych usług i sprawdzanie co minutę. Oddziel wiele nazw usług przecinkami."
"After start. Command to run after the service starts.": "Po uruchomieniu. Polecenie wykonywane po uruchomieniu usługi."
"Enable the web management panel. Default true.": "Włącz panel zarządzania siecią. Domyślnie true."
"Web management panel port. Default 5580.": "Port panelu zarządzania siecią. Domyślnie 5580."
"Web panel bind address. Default 127.0.0.1 for local access only; set to * to listen on all interfaces, or specify an IP address.": "Adres powiązania panelu sieciowego. Domyślnie 127.0.0.1 tylko dla dostępu lokalnego; ustaw * aby nasłuchiwać na wszystkich interfejsach lub podaj adres IP."
"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Poziom uwierzytelniania panelu sieciowego. None: bez uwierzytelniania; LocalOnly: lokalne żądania pomijają uwierzytelnianie; Full: zawsze uwierzytelniaj. Domyślnie LocalOnly."
"Web panel user name.": "Nazwa użytkownika panelu sieciowego."
"Web panel password.": "Hasło panelu sieciowego."
"Application started. Hosting environment: {0}": "Aplikacja uruchomiona. Środowisko hostingu: {0}"
"Application is shutting down...": "Aplikacja jest zamykana..."
"Menu exited normally": "Menu zostało zamknięte normalnie"
