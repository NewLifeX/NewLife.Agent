# Ελληνικά 词表（el）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Simulation is running...": "Η προσομοίωση εκτελείται..."
"Press any key to stop the simulation.": "Πατήστε οποιοδήποτε πλήκτρο για να σταματήσετε την προσομοίωση."
"Service {0} was not found; is it installed?": "Η υπηρεσία {0} δεν βρέθηκε· είναι εγκατεστημένη;"
"Service {0} was stopped; starting it now.": "Η υπηρεσία {0} ήταν σταματημένη· ξεκινά τώρα."
"Enter a command number: ": "Εισαγάγετε αριθμό εντολής: "
"StartWork failed: {0}": "Το StartWork απέτυχε: {0}"
"StartWork took too long; avoid blocking operations in StartWork.": "Το StartWork άργησε πολύ· αποφύγετε τις αποκλειστικές λειτουργίες στο StartWork."
"Process memory usage {0:n0} MB exceeds the threshold {1:n0} MB; restarting.": "Η χρήση μνήμης της διεργασίας {0:n0} MB υπερβαίνει το όριο {1:n0} MB· γίνεται επανεκκίνηση."
"Process thread count {0:n0} exceeds the threshold {1:n0}; restarting.": "Ο αριθμός νημάτων της διεργασίας {0:n0} υπερβαίνει το όριο {1:n0}· γίνεται επανεκκίνηση."
"Process handle count {0:n0} exceeds the threshold {1:n0}; restarting.": "Ο αριθμός λαβών της διεργασίας {0:n0} υπερβαίνει το όριο {1:n0}· γίνεται επανεκκίνηση."
"The web management panel started on port {0}.": "Ο πίνακας διαχείρισης ιστού ξεκίνησε στη θύρα {0}."
"Security warning: the web panel listens on all interfaces and still uses the default password; change it as soon as possible.": "Προειδοποίηση ασφαλείας: ο πίνακας ιστού ακούει σε όλες τις διεπαφές και εξακολουθεί να χρησιμοποιεί τον προεπιλεγμένο κωδικό πρόσβασης· αλλάξτε τον το συντομότερο δυνατό."
