"Service name": "Όνομα υπηρεσίας"
"Display name": "Εμφανιζόμενο όνομα"
"Service description": "Περιγραφή υπηρεσίας"
"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Αυτόματη εκκίνηση. Στα Windows, η αυτόματη εκκίνηση εκτελείται στην επιφάνεια εργασίας μετά τη σύνδεση αντί να εκτελείται ως υπηρεσία παρασκηνίου. Προεπιλογή false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Διάστημα παρακολούθησης. Περίοδος ελέγχου χρήσης πόρων σε δευτερόλεπτα. Προεπιλογή 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Διάστημα απελευθέρωσης μνήμης. Περιοδική εκτέλεση GC και απελευθέρωση εικονικής μνήμης, σε δευτερόλεπτα. Προεπιλογή 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Μέγιστη μνήμη. Επανεκκινήστε τη διεργασία όταν η χρήση υπερβαίνει αυτή την τιμή για απελευθέρωση πόρων. Προεπιλογή 0 σημαίνει απεριόριστο."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Μέγιστος αριθμός νημάτων. Επανεκκινήστε τη διεργασία όταν ο αριθμός νημάτων υπερβαίνει αυτή την τιμή για απελευθέρωση πόρων. Προεπιλογή 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Μέγιστος αριθμός λαβών. Επανεκκινήστε τη διεργασία όταν ο αριθμός λαβών υπερβαίνει αυτή την τιμή για απελευθέρωση πόρων. Προεπιλογή 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Αυτόματη επανεκκίνηση. Αυτόματη επανεκκίνηση της διεργασίας όταν επιτευχθεί αυτό το διάστημα, σε λεπτά. Προεπιλογή 0 σημαίνει απεριόριστο."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Χρονικό εύρος αυτόματης επανεκκίνησης. Περιορισμός επανεκκινήσεων σε αυτό το παράθυρο, μορφή 00:00-06:00. Προεπιλογή απεριόριστο."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. Προστασία άλλων υπηρεσιών και έλεγχος κάθε λεπτό. Διαχωρίστε πολλά ονόματα υπηρεσιών με κόμματα."
"After start. Command to run after the service starts.": "Μετά την εκκίνηση. Εντολή που εκτελείται μετά την εκκίνηση της υπηρεσίας."
"Enable the web management panel. Default true.": "Ενεργοποίηση του πίνακα διαχείρισης ιστού. Προεπιλογή true."
"Web management panel port. Default 5580.": "Θύρα του πίνακα διαχείρισης ιστού. Προεπιλογή 5580."
"Web panel bind address. Default 127.0.0.1 for local access only; set to * to listen on all interfaces, or specify an IP address.": "Διεύθυνση σύνδεσης του πίνακα ιστού. Προεπιλογή 127.0.0.1 μόνο για τοπική πρόσβαση· ορίστε * για ακρόαση σε όλες τις διεπαφές ή καθορίστε διεύθυνση IP."
"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Επίπεδο ελέγχου ταυτότητας του πίνακα ιστού. None: χωρίς έλεγχο ταυτότητας· LocalOnly: τα τοπικά αιτήματα παρακάμπτουν τον έλεγχο· Full: πάντα έλεγχος ταυτότητας. Προεπιλογή LocalOnly."
