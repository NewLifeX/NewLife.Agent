"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Interval for frigivelse af hukommelse. Kør GC regelmæssigt og frigiv virtuel hukommelse, i sekunder. Standard 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Maksimal hukommelse. Genstart processen, når forbruget overstiger denne værdi, for at frigive ressourcer. Standard 0 betyder ubegrænset."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Maksimalt antal tråde. Genstart processen, når antallet af tråde overstiger denne værdi, for at frigive ressourcer. Standard 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Maksimalt antal handles. Genstart processen, når antallet af handles overstiger denne værdi, for at frigive ressourcer. Standard 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Automatisk genstart. Genstart processen automatisk, når dette interval nås, i minutter. Standard 0 betyder ubegrænset."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Tidsinterval for automatisk genstart. Begræns genstarter til dette tidsvindue, format 00:00-06:00. Standard ubegrænset."
