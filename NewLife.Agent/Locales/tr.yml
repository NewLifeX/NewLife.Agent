"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Otomatik başlatma. Windows'ta otomatik başlatma, arka plan hizmeti olarak çalışmak yerine oturum açtıktan sonra masaüstünde çalışır. Varsayılan false."
"Watch interval. Resource usage check period in seconds. Default 10.": "İzleme aralığı. Kaynak kullanımı denetim süresi, saniye cinsinden. Varsayılan 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Bellek boşaltma aralığı. GC'yi düzenli olarak çalıştırın ve sanal belleği boşaltın, saniye cinsinden. Varsayılan 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Maksimum bellek. Kullanım bu değeri aştığında kaynakları boşaltmak için işlemi yeniden başlatın. Varsayılan 0 sınırsız anlamına gelir."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Maksimum iş parçacığı sayısı. İş parçacığı sayısı bu değeri aştığında kaynakları boşaltmak için işlemi yeniden başlatın. Varsayılan 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Maksimum tanıtıcı sayısı. Tanıtıcı sayısı bu değeri aştığında kaynakları boşaltmak için işlemi yeniden başlatın. Varsayılan 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Otomatik yeniden başlatma. Bu aralığa ulaşıldığında işlemi otomatik olarak yeniden başlatın, dakika cinsinden. Varsayılan 0 sınırsız anlamına gelir."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Otomatik yeniden başlatma zaman aralığı. Yeniden başlatmaları bu zaman aralığıyla sınırlayın, biçim 00:00-06:00. Varsayılan sınırsız."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. Diğer hizmetleri koruyun ve her dakika denetleyin. Birden çok hizmet adını virgülle ayırın."
