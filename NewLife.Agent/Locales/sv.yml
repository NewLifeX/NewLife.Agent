"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Automatisk start. I Windows startas autorun på skrivbordet efter inloggning i stället för att köras som bakgrundstjänst. Standard false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Övervakningsintervall. Kontrollperiod för resursanvändning i sekunder. Standard 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Intervall för minnesfrigöring. Kör GC regelbundet och frigör virtuellt minne, i sekunder. Standard 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Maximalt minne. Starta om processen när användningen överskrider detta värde för att frigöra resurser. Standard 0 betyder obegränsat."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Maximalt antal trådar. Starta om processen när antalet trådar överskrider detta värde för att frigöra resurser. Standard 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Maximalt antal handtag. Starta om processen när antalet handtag överskrider detta värde för att frigöra resurser. Standard 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Automatisk omstart. Starta om processen automatiskt när detta intervall nås, i minuter. Standard 0 betyder obegränsat."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Tidsintervall för automatisk omstart. Begränsa omstarter till detta tidsfönster, format 00:00-06:00. Standard obegränsat."
