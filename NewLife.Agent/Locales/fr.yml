"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Niveau d'authentification du panneau web. None : aucune authentification ; LocalOnly : les requêtes locales contournent l'authentification ; Full : toujours authentifier. Par défaut LocalOnly."
