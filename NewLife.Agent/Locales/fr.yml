"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Démarrage automatique. Sous Windows, le démarrage automatique s'exécute sur le bureau après connexion au lieu de s'exécuter comme service en arrière-plan. Par défaut false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Intervalle de surveillance. Période de vérification de l'utilisation des ressources, en secondes. Par défaut 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Intervalle de libération de mémoire. Exécuter périodiquement le GC et libérer la mémoire virtuelle, en secondes. Par défaut 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Mémoire maximale. Redémarrer le processus lorsque l'utilisation dépasse cette valeur afin de libérer des ressources. Par défaut 0 signifie illimité."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Nombre maximal de threads. Redémarrer le processus lorsque le nombre de threads dépasse cette valeur afin de libérer des ressources. Par défaut 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Nombre maximal de handles. Redémarrer le processus lorsque le nombre de handles dépasse cette valeur afin de libérer des ressources. Par défaut 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Redémarrage automatique. Redémarrer automatiquement le processus lorsque cet intervalle est atteint, en minutes. Par défaut 0 signifie illimité."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Plage horaire de redémarrage automatique. Limiter les redémarrages à cette plage, format 00:00-06:00. Par défaut illimité."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Chien de garde. Protéger d'autres services et vérifier chaque minute. Séparer plusieurs noms de services par des virgules."
"After start. Command to run after the service starts.": "Après le démarrage. Commande à exécuter après le démarrage du service."
