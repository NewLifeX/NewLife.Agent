"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Jalankan automatik. Pada Windows, jalankan automatik berjalan di desktop selepas log masuk dan bukan sebagai perkhidmatan latar belakang. Lalai false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Selang pemantauan. Tempoh semakan penggunaan sumber dalam saat. Lalai 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Selang pelepasan memori. Jalankan GC secara berkala dan lepaskan memori maya, dalam saat. Lalai 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Memori maksimum. Mulakan semula proses apabila penggunaan melebihi nilai ini untuk melepaskan sumber. Lalai 0 bermaksud tanpa had."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Bilangan benang maksimum. Mulakan semula proses apabila bilangan benang melebihi nilai ini untuk melepaskan sumber. Lalai 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Bilangan pengendali maksimum. Mulakan semula proses apabila bilangan pengendali melebihi nilai ini untuk melepaskan sumber. Lalai 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Mulakan semula automatik. Mulakan semula proses secara automatik apabila selang ini dicapai, dalam minit. Lalai 0 bermaksud tanpa had."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Julat masa mulakan semula automatik. Hadkan permulaan semula kepada tetingkap masa ini, format 00:00-06:00. Lalai tanpa had."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. Lindungi perkhidmatan lain dan semak setiap minit. Pisahkan beberapa nama perkhidmatan dengan koma."
"After start. Command to run after the service starts.": "Selepas bermula. Arahan untuk dijalankan selepas perkhidmatan bermula."
