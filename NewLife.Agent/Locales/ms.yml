"Unknown command: {0}": "Perintah tidak dikenali: {0}"
"Refusing to start: set WebPassword in the configuration file first. First-run setup is only available on 127.0.0.1.": "Menolak dimulakan: tetapkan WebPassword dalam fail konfigurasi dahulu. Persediaan kali pertama hanya tersedia pada 127.0.0.1."
"The web panel is in first-run setup mode. Open {0}://{1}:{2}/ on this machine to set the administrator password.": "Panel web dalam mod persediaan kali pertama. Buka {0}://{1}:{2}/ pada mesin ini untuk menetapkan kata laluan pentadbir."
"The web management panel started on {0} port {1}.": "Panel pengurusan web dimulakan pada port {1} ({0})."
"Refusing to start: the web panel listens on a non-loopback address without TLS. Keep WebBind=127.0.0.1 and use a reverse proxy or SSH tunnel, or set AllowInsecureRemote=true in the configuration file if you accept the risk.": "Menolak dimulakan: panel web mendengar pada alamat bukan gelung balik tanpa TLS. Kekalkan WebBind=127.0.0.1 dan gunakan proksi songsang atau terowong SSH, atau tetapkan AllowInsecureRemote=true dalam fail konfigurasi jika anda menerima risiko."
"Refusing to start: the web panel listens on a non-loopback address while still using the default password. Set WebPassword in the configuration file first; first-run setup is only available on 127.0.0.1.": "Menolak dimulakan: panel web mendengar pada alamat bukan gelung balik sambil masih menggunakan kata laluan lalai. Tetapkan WebPassword dalam fail konfigurasi dahulu; persediaan kali pertama hanya tersedia pada 127.0.0.1."
"The web panel is already rebinding, ignore this request.": "Panel web sudah mengikat semula; permintaan ini diabaikan."
"Failed to listen on the new address, rolling back: {0}": "Gagal mendengar pada alamat baharu; melakukan rollback: {0}"
"Failed to restore the previous address, the web panel is unavailable until the service restarts: {0}": "Gagal memulihkan alamat sebelumnya; panel web tidak tersedia sehingga perkhidmatan dimulakan semula: {0}"
"The web management panel has moved to {0}://{1}:{2}.": "Panel pengurusan web telah berpindah ke {0}://{1}:{2}."
"The web panel password hash has been upgraded to the current work factor.": "Hash kata laluan panel web telah dinaik taraf kepada faktor kerja semasa."
"Failed to tighten the permission of {0}.": "Gagal mengetatkan kebenaran {0}."
"Failed to tighten the permission of {0}: {1}": "Gagal mengetatkan kebenaran {0}: {1}"
"Invalid RestartTimeRange '{0}'; automatic restart is disabled until it is corrected.": "RestartTimeRange '{0}' tidak sah; mula semula automatik dinyahdayakan sehingga dibetulkan."
"Allow the web panel to listen on a non-loopback address over plain HTTP. Default false; terminate TLS with a reverse proxy or use an SSH tunnel instead.": "Membenarkan panel web mendengar pada alamat bukan gelung balik melalui HTTP biasa. Lalai false; tamatkan TLS dengan proksi songsang atau gunakan terowong SSH."
"Trust the X-Forwarded-For header from a local reverse proxy. Default false; enabling it lets any local client spoof the header and bypass login rate limiting.": "Percaya pengepala X-Forwarded-For daripada proksi songsang tempatan. Lalai false; apabila didayakan, mana-mana klien tempatan boleh memalsukan pengepala dan memintas had cubaan log masuk."
