"Web panel authentication level. None: no authentication; LocalOnly: local requests bypass authentication; Full: always authenticate. Default LocalOnly.": "Tahap pengesahan panel web. None: tiada pengesahan; LocalOnly: permintaan setempat memintas pengesahan; Full: sentiasa sahkan. Lalai LocalOnly."
