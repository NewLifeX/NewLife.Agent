"Use autorun. On Windows, autorun starts on the desktop after login instead of running as a background service. Default false.": "Automatikus indítás. Windowson az automatikus indítás bejelentkezés után az asztalon fut, nem háttérszolgáltatásként. Alapértelmezés false."
"Watch interval. Resource usage check period in seconds. Default 10.": "Figyelési időköz. Az erőforrás-használat ellenőrzési időszaka másodpercben. Alapértelmezés 10."
"Free memory interval. Periodically run GC and release virtual memory, in seconds. Default 600.": "Memóriafelszabadítási időköz. Rendszeres GC futtatás és virtuális memória felszabadítása, másodpercben. Alapértelmezés 600."
"Max memory. Restart the process when usage exceeds this value to release resources. Default 0 means unlimited.": "Maximális memória. Indítsa újra a folyamatot, ha a használat meghaladja ezt az értéket az erőforrások felszabadításához. Alapértelmezés 0: korlátlan."
"Max thread count. Restart the process when the thread count exceeds this value to release resources. Default 1000.": "Maximális szálszám. Indítsa újra a folyamatot, ha a szálak száma meghaladja ezt az értéket az erőforrások felszabadításához. Alapértelmezés 1000."
"Max handle count. Restart the process when the handle count exceeds this value to release resources. Default 10000.": "Maximális leírószám. Indítsa újra a folyamatot, ha a leírók száma meghaladja ezt az értéket az erőforrások felszabadításához. Alapértelmezés 10000."
"Auto restart. Automatically restart the process when this interval is reached, in minutes. Default 0 means unlimited.": "Automatikus újraindítás. A folyamat automatikus újraindítása ezen időköz elérésekor, percben. Alapértelmezés 0: korlátlan."
"Auto restart time range. Restrict restarts to this time window, format 00:00-06:00. Default unlimited.": "Automatikus újraindítás időtartománya. Az újraindítások korlátozása erre az időablakra, formátum 00:00-06:00. Alapértelmezés korlátlan."
"Watchdog. Protect other services and check every minute. Separate multiple service names with commas.": "Watchdog. Más szolgáltatások védelme és percenkénti ellenőrzés. Több szolgáltatásnevet vesszővel válasszon el."
"After start. Command to run after the service starts.": "Indítás után. A szolgáltatás indítása után futtatandó parancs."
