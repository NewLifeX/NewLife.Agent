name: test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

# 单元测试矩阵：覆盖 win-x64 / linux-x64 / linux-arm64 / linux-loongarch64（QEMU 用户态仿真）。
# 全部在 push/PR 触发，不设夜间计划任务。AOT 与发布冒烟见 aot.yml。
jobs:
  # 全解决方案编译校验（含 Samples/Zero.* 等非测试工程），与测试矩阵并行运行
  build:
    name: build solution
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Build
      run: dotnet build -c Release

  # 原生架构单元测试矩阵
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64,     os: windows-latest }
          - { name: linux-x64,   os: ubuntu-latest,    coverage: true }
          - { name: linux-arm64, os: ubuntu-24.04-arm }

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Test
      shell: bash
      # blame-hang：用例挂起时超时转储，便于定位（正常单 job 约 1 分钟，远小于 10 分钟阈值）
      run: |
        args=(UnitTest/UnitTest.csproj -c Release --blame-hang-timeout 10m)
        if [ "${{ matrix.coverage }}" = "true" ]; then
          args+=(--collect:"XPlat Code Coverage" --results-directory ./TestResults)
        fi
        dotnet test "${args[@]}"
    - name: Upload coverage
      if: matrix.coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: TestResults/**/coverage.cobertura.xml
        if-no-files-found: warn

  # linux-loongarch64 单元测试：GitHub 无 LA64 原生 runner，用 qemu-loongarch64 用户态仿真。
  # rootfs 取 Debian sid（loong64 已并入官方归档），.NET SDK 用龙芯发行版。
  test-loongarch64:
    name: test (linux-loongarch64 qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Build tests (host)
      # 龙芯 SDK 自带的 MSBuild 为 NativeAOT 产物，在 QEMU 仿真下存在反射桩缺陷
      # （任务参数取值 NRE、非法指令），故改在宿主原生构建：托管程序集与架构无关，
      # chroot 内只运行测试宿主，验证测试在 LA64 运行时上的真实行为。
      run: dotnet build UnitTest/UnitTest.csproj -c Release
    - name: Setup loong64 QEMU environment
      uses: ./.github/actions/loong64-qemu
      with:
        dotnet-sdk: 10.0.113
    - name: Unit tests under QEMU
      shell: bash
      run: |
        set -euo pipefail
        cat > /tmp/run-tests.sh <<'SCRIPT'
        #!/bin/bash
        set -euo pipefail
        # 宿主 runner 的 XDG_RUNTIME_DIR/DOTNET_CLI_HOME 在 chroot 内不适用，重置为 root 家目录
        unset XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS
        export DOTNET_CLI_HOME=/root DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
        export DOTNET_ROOT=/usr/share/dotnet
        export PATH=/usr/share/dotnet:$PATH
        cd "$WORKSPACE"
        dotnet --info
        # 宿主构建产物中的 testhost 为宿主 RID 的原生宿主，移除后 VSTest 退回 dotnet exec testhost.dll
        rm -f Bin/UnitTest/net10.0/testhost
        dotnet vstest Bin/UnitTest/net10.0/UnitTest.dll --logger:"trx;LogFileName=loongarch64.trx" --ResultsDirectory:TestResults
        SCRIPT
        sudo cp /tmp/run-tests.sh "$LOONG64_ROOTFS/tmp/run-tests.sh"
        sudo chroot "$LOONG64_ROOTFS" /usr/bin/env WORKSPACE="$GITHUB_WORKSPACE" /bin/bash /tmp/run-tests.sh
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux-loongarch64
        path: TestResults/*.trx
        if-no-files-found: ignore
